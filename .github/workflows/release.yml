name: release

on:
  workflow_run:
    workflows: [ci]
    types: [completed]
    branches: [main]

permissions:
  contents: write

jobs:
  release:
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: macos-14
    steps:
      # Check out main (not the detached workflow_run sha) so we can push the cask update back.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: main
          fetch-depth: 0

      - name: Build app bundle
        run: ./build.sh

      - name: Package app
        run: ditto -c -k --sequesterRsrc --keepParent Zap.app Zap.zip

      - name: Semantic Release
        id: semantic
        uses: cycjimmy/semantic-release-action@b12c8f6015dc215fe37bc154d4ad456dd3833c90 # v6.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Update Homebrew cask
        if: steps.semantic.outputs.new_release_published == 'true'
        run: |
          VERSION="${{ steps.semantic.outputs.new_release_version }}"
          SHA=$(shasum -a 256 Zap.zip | awk '{print $1}')
          sed -i '' "s/version \".*\"/version \"$VERSION\"/" Casks/zap.rb
          sed -i '' "s/sha256 \".*\"/sha256 \"$SHA\"/" Casks/zap.rb
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Casks/zap.rb
          git commit -m "chore(cask): update to v$VERSION" || echo "cask unchanged"
          git push origin HEAD:main
